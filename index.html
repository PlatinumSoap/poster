<!DOCTYPE html>
<html
  lang="en">
<head>
  <meta
    charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">
  <title>Earthquake Preparedness Poster</title>
  <meta
    name="description"
    content="Earthquake preparedness safety poster built entirely with HTML.">
  <link
    rel="icon"
    type="image/png"
    href="favicon.png">
</head>

<body
  bgcolor="#ECECEC"
  text="#562E1A"
  link="#B3282D"
  vlink="#7A4035"
  alink="#008B60"
  topmargin="0"
  bottommargin="0"
  leftmargin="0"
  rightmargin="0"
  marginwidth="0"
  marginheight="0">
  <center>

    <!-- 1. TOP HEADER POLYGON IMAGE -->
    <svg
      width="100%"
      height="180"
      viewBox="0 0 1000 180"
      preserveAspectRatio="none">
      <defs>
        <clipPath
          id="headerPolygonClip">
          <polygon
            points="0,0 1000,0 1000,120 0,180" />
        </clipPath>
      </defs>
      
      <image
        href="123.jpg"
        width="1000"
        height="180"
        preserveAspectRatio="xMidYMid slice"
        clip-path="url(#headerPolygonClip)" />
      
      <polygon
        points="0,0 1000,0 1000,120 0,180"
        fill="#B3282D"
        fill-opacity="0.3" />
    </svg>

    <br><br>

    <!-- 2. TITLES & SUBTEXT -->
    <font
      face="Arial Black, Impact, sans-serif"
      size="7"
      color="#562E1A">EARTHQUAKE</font>
    <br>
    <font
      face="Arial Black, Impact, sans-serif"
      size="7"
      color="#B3282D">PREPAREDNESS</font>
    <br><br>
    <font
      face="Arial, Helvetica, sans-serif"
      size="5"
      color="#008B60"><b>DROP &nbsp; COVER &nbsp; HOLD ON</b></font>
    <br><br>
    <font
      face="Arial, Helvetica, sans-serif"
      size="4"
      color="#7A4035">Be Aware Before The Ground Shakes</font>
    <br><br>
    <hr
      width="85%"
      color="#B3282D"
      size="4">
    <br>

    <!-- 3. TOP PRIMARY CARDS -->
    <svg
      width="90%"
      height="360"
      viewBox="0 0 900 360">
      
      <!-- INDOORS POLYGON -->
      <polygon
        points="0,0 435,0 415,350 0,350"
        fill="#B3282D" />
      
      <text
        x="210"
        y="50"
        fill="#FFFFFF"
        font-family="Arial Black, Impact, sans-serif"
        font-size="24"
        font-weight="bold"
        letter-spacing="1"
        text-anchor="middle">INDOORS</text>
      
      <text
        x="210"
        y="120"
        fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        text-anchor="middle">
        <tspan
          x="210"
          dy="0">Drop to the floor against an interior</tspan>
        <tspan
          x="210"
          dy="28">wall and protect your head and neck with</tspan>
        <tspan
          x="210"
          dy="28">your arms if you are not near a desk or table.</tspan>
        <tspan
          x="210"
          dy="65"
          font-weight="bold">Do not go outside until well</tspan>
        <tspan
          x="210"
          dy="28"
          font-weight="bold">after the shaking stops!</tspan>
      </text>

      <!-- OUTDOORS POLYGON -->
      <polygon
        points="465,0 900,0 900,350 485,350"
        fill="#008B60" />
      
      <text
        x="690"
        y="50"
        fill="#FFFFFF"
        font-family="Arial Black, Impact, sans-serif"
        font-size="24"
        font-weight="bold"
        letter-spacing="1"
        text-anchor="middle">OUTDOORS</text>
      
      <text
        x="690"
        y="150"
        fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        text-anchor="middle">
        <tspan
          x="690"
          dy="0"
          font-weight="bold">Move to a clear area</tspan>
        <tspan
          x="690"
          dy="28"
          font-weight="bold">if you can safely do so.</tspan>
        <tspan
          x="690"
          dy="50">Avoid buildings, power lines,</tspan>
        <tspan
          x="690"
          dy="28">and trees.</tspan>
      </text>
    </svg>
    <br><br>
    <hr
      width="85%"
      color="#008B60"
      size="4">
    <br>

    <!-- 4. BANNER IMAGE (CLEAN, SUBTLE STAR LINK) -->
    <svg
      width="85%"
      height="450"
      viewBox="0 0 1000 600"
      preserveAspectRatio="xMidYMid meet">
      
      <!-- Base Image -->
      <image
        href="456.png"
        width="1000"
        height="600"
        preserveAspectRatio="xMidYMid meet" />
      
      <!-- Clickable Red Star Mapping with Native Tooltip -->
      <a
        href="https://www.ndma.gov.in/earthquakes"
        target="_blank">
        <title>Visit NDMA India Earthquake Awareness</title>

        <!-- Subtle, clean helper label -->
        <text
          x="160"
          y="105"
          fill="#B3282D"
          font-family="Arial, Helvetica, sans-serif"
          font-size="14"
          font-weight="bold"
          text-anchor="middle">(Click star for NDMA info)</text>

        <!-- Clickable Area -->
        <polygon
          points="160,135 183,195 247,195 196,235 215,295 160,255 105,295 124,235 73,195 137,195"
          fill="#FFFFFF"
          fill-opacity="0"
          cursor="pointer" />
      </a>
    </svg>
    <br><br><br>

    <hr
      width="85%"
      color="#B3282D"
      size="4">
    <br><br>

    <!-- 5. CRACKED-EARTH SCENARIOS -->
    <svg
      width="90%"
      height="750"
      viewBox="0 0 900 750">
      
      <!-- Plate 1: In Bed -->
      <polygon
        points="10,10 435,0 415,160 440,240 410,355 180,365 20,340 0,180"
        fill="#FFFFFF"
        stroke="#562E1A"
        stroke-width="2" />
      
      <text
        x="40"
        y="45"
        fill="#B3282D"
        font-family="Arial Black, Impact, sans-serif"
        font-size="22">In bed</text>
      
      <image
        href="bearslip.png"
        x="240"
        y="215"
        width="155"
        height="115"
        preserveAspectRatio="xMidYMid meet" />
      
      <text
        x="40"
        y="75"
        fill="#562E1A"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14.5">
        <tspan
          x="40"
          dy="0">Hold on and stay there, protecting</tspan>
        <tspan
          x="40"
          dy="22">your head with a pillow. You are</tspan>
        <tspan
          x="40"
          dy="22">less likely to be injured staying</tspan>
        <tspan
          x="40"
          dy="22">where you are.</tspan>
        <tspan
          x="40"
          dy="30">Broken glass on the floor</tspan>
        <tspan
          x="40"
          dy="22">can cause injuries; be</tspan>
        <tspan
          x="40"
          dy="22">sure to put shoes on</tspan>
        <tspan
          x="40"
          dy="22">before stepping out!</tspan>
      </text>

      <!-- Plate 2: Driving -->
      <polygon
        points="465,0 890,10 900,190 880,350 710,360 480,345 450,235 480,150"
        fill="#FFFFFF"
        stroke="#562E1A"
        stroke-width="2" />
      
      <text
        x="490"
        y="45"
        fill="#008B60"
        font-family="Arial Black, Impact, sans-serif"
        font-size="22">Driving</text>
      
      <image
        href="bearcar.png"
        x="720"
        y="215"
        width="155"
        height="115"
        preserveAspectRatio="xMidYMid meet" />
      
      <text
        x="490"
        y="75"
        fill="#562E1A"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
        <tspan
          x="490"
          dy="0">When able, safely pull over to the side</tspan>
        <tspan
          x="490"
          dy="20">of the road, stop, and set parking brake.</tspan>
        <tspan
          x="490"
          dy="20">Avoid overpasses, power lines, signs,</tspan>
        <tspan
          x="490"
          dy="20">trees, and falling hazards.</tspan>
        <tspan
          x="490"
          dy="28">Stay inside the vehicle</tspan>
        <tspan
          x="490"
          dy="20">until shaking stops. If wires</tspan>
        <tspan
          x="490"
          dy="20">fall on vehicle, wait for help.</tspan>
      </text>

      <!-- Plate 3: Theater -->
      <polygon
        points="15,385 195,395 415,380 445,490 410,610 435,735 15,745 0,560"
        fill="#FFFFFF"
        stroke="#562E1A"
        stroke-width="2" />
      
      <text
        x="35"
        y="420"
        fill="#B3282D"
        font-family="Arial Black, Impact, sans-serif"
        font-size="21">In a public building or theater</text>
      
      <image
        href="bearmovie.png"
        x="245"
        y="585"
        width="150"
        height="135"
        preserveAspectRatio="xMidYMid meet" />
      
      <text
        x="35"
        y="450"
        fill="#562E1A"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
        <tspan
          x="35"
          dy="0">If in a theater seat, duck down and</tspan>
        <tspan
          x="35"
          dy="22">protect your head and neck with arms.</tspan>
        <tspan
          x="35"
          dy="22">Don't try to rush out until shaking stops.</tspan>
        <tspan
          x="35"
          dy="30">Then walk out slowly,</tspan>
        <tspan
          x="35"
          dy="22">watching carefully for</tspan>
        <tspan
          x="35"
          dy="22">fallen debris or aftershocks.</tspan>
      </text>

      <!-- Plate 4: Shore -->
      <polygon
        points="480,380 705,390 890,380 900,560 880,740 455,745 480,620 450,500"
        fill="#FFFFFF"
        stroke="#562E1A"
        stroke-width="2" />
      
      <text
        x="490"
        y="420"
        fill="#008B60"
        font-family="Arial Black, Impact, sans-serif"
        font-size="21">Near the shore</text>
      
      <image
        href="bearbeach.png"
        x="710"
        y="585"
        width="160"
        height="135"
        preserveAspectRatio="xMidYMid meet" />
      
      <text
        x="490"
        y="450"
        fill="#562E1A"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
        <tspan
          x="490"
          dy="0">If you feel a strong quake, hear a</tspan>
        <tspan
          x="490"
          dy="22">warning, or notice water withdrawing,</tspan>
        <tspan
          x="490"
          dy="22">evacuate immediately to higher ground.</tspan>
        <tspan
          x="490"
          dy="30">Tsunami waves may</tspan>
        <tspan
          x="490"
          dy="22">continue for hours. Do not</tspan>
        <tspan
          x="490"
          dy="22">return until all-clear is given.</tspan>
      </text>
    </svg>

    <br><br>
    <hr
      width="85%"
      color="#008B60"
      size="4">
    <br>

    <!-- 6. CONTACT -->
    <font
      face="Arial Black, Impact, sans-serif"
      size="5"
      color="#562E1A">CONTACT</font>
    <br><br>
    <font
      face="Arial, Helvetica, sans-serif"
      size="4"
      color="#7A4035">
      <a
        href="mailto:random@gmail.com"><b><font color="#7A4035">Yash@gmail.com</font></b></a>
      &nbsp;&nbsp;|&nbsp;&nbsp;
      <a
        href="tel:123456789"><b><font color="#7A4035">123456789</font></b></a>
      &nbsp;&nbsp;|&nbsp;&nbsp;
      <a
        href="https://www.google.com/maps/search/?api=1&query=Goa+College+of+Engineering+Farmagudi+Ponda+Goa"
        target="_blank"><b><u><font color="#7A4035">GEC Goa</font></u></b></a>
    </font>
    <br><br><br>

    <!-- 7. BOTTOM FOOTER POLYGON IMAGE -->
    <svg
      width="100%"
      height="180"
      viewBox="0 0 1000 180"
      preserveAspectRatio="none">
      <defs>
        <clipPath
          id="footerPolygonClip">
          <polygon
            points="0,60 1000,0 1000,180 0,180" />
        </clipPath>
      </defs>
      
      <image
        href="123.jpg"
        width="1000"
        height="180"
        preserveAspectRatio="xMidYMid slice"
        clip-path="url(#footerPolygonClip)" />
      
      <polygon
        points="0,60 1000,0 1000,180 0,180"
        fill="#B3282D"
        fill-opacity="0.3" />
    </svg>

  </center>
</body>
</html>
